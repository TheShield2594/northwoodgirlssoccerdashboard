services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: northwood
      # Required — set POSTGRES_PASSWORD in Portainer's stack env before deploying.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the stack environment}
      POSTGRES_DB: northwood_stats
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwood"]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    build: ./scraper
    restart: unless-stopped
    environment:
      # Discrete PG* vars (read natively by node-postgres) so passwords with
      # URI-special characters never need percent-encoding.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: northwood
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the stack environment}
      PGDATABASE: northwood_stats
      # The 6am daily scrape fires in this timezone.
      TZ: America/Indiana/Indianapolis
      # HTML of every fetched page is cached here so parser fixes can be
      # re-run without re-hitting maxpreps.com (npm run reparse).
      SCRAPE_CACHE_DIR: /cache
      # Optional: a Discord (or Slack) incoming webhook. Each run posts a
      # summary here when something regressed — a season that had stats and
      # now parses none, a parser that dropped to its DOM fallback. Leave it
      # unset and the summary only goes to the container log.
      SCRAPE_WEBHOOK_URL: ${SCRAPE_WEBHOOK_URL:-}
      # Set to 1 to get the clean runs too. Off by default: a message that
      # arrives every morning stops being read by the time it matters.
      SCRAPE_WEBHOOK_ALWAYS: ${SCRAPE_WEBHOOK_ALWAYS:-}
    volumes:
      - scrapecache:/cache
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: northwood
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the stack environment}
      PGDATABASE: northwood_stats
      TZ: America/Indiana/Indianapolis
      # Set DEMO_MODE=1 to force the bundled sample dataset (the dashboard
      # also falls back to it automatically if the DB is empty/unreachable).
      DEMO_MODE: "0"
    ports:
      - "3300:3000"   # adjust host port / reverse-proxy as you like
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  scrapecache:
