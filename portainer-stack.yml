# Portainer stack — prebuilt images, no build step.
#
# Deploy: Stacks → Add stack → Web editor, paste this, set POSTGRES_PASSWORD
# in the stack's environment variables, Deploy.
# Update: open the stack → Update the stack → tick "Re-pull image and
# redeploy" → Update. That pulls whatever :latest currently points at, which
# the "Publish images" workflow moves on every push to main.
#
# Optional env vars: IMAGE_TAG (default latest), DASHBOARD_PORT (default 3300).
#
# If the packages are private, add the ghcr.io registry to Portainer first
# (Registries → Custom registry, username = your GitHub handle, password = a
# PAT with read:packages) — or just flip each package to Public on GitHub.

services:
  postgres:
    image: ghcr.io/theshield2594/northwoodgirlssoccerdashboard/postgres:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_USER: northwood
      # Required — set POSTGRES_PASSWORD in Portainer's stack env before deploying.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the stack environment}
      POSTGRES_DB: northwood_stats
    volumes:
      # schema.sql is baked into the image, applied on first boot only.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwood"]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    image: ghcr.io/theshield2594/northwoodgirlssoccerdashboard/scraper:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      # Discrete PG* vars (read natively by node-postgres) so passwords with
      # URI-special characters never need percent-encoding.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: northwood
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the stack environment}
      PGDATABASE: northwood_stats
      # The 6am daily scrape fires in this timezone.
      TZ: America/Indiana/Indianapolis
      # HTML of every fetched page is cached here so parser fixes can be
      # re-run without re-hitting maxpreps.com (npm run reparse).
      SCRAPE_CACHE_DIR: /cache
    volumes:
      - scrapecache:/cache
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    image: ghcr.io/theshield2594/northwoodgirlssoccerdashboard/dashboard:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: northwood
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the stack environment}
      PGDATABASE: northwood_stats
      TZ: America/Indiana/Indianapolis
      # Set DEMO_MODE=1 to force the bundled sample dataset (the dashboard
      # also falls back to it automatically if the DB is empty/unreachable).
      DEMO_MODE: "0"
    ports:
      - "${DASHBOARD_PORT:-3300}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  scrapecache:
